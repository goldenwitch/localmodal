name: Modal startup measurement

on:
  workflow_dispatch:
    inputs:
      max_model_len:
        description: Context length to measure
        required: true
        type: choice
        default: "131072"
        options:
          - "32768"
          - "131072"
          - "262144"
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: modal-live-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extension-live:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LOCALMODAL_LIVE_TEST: "1"
      LOCALMODAL_TEST_APP_NAME: localmodal-qwen-live-${{ github.run_id }}
      VSCODE_TEST_VERSION: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install modal==1.3.5
      - run: npm ci
      - name: Run live Extension Host/MCP integration
        run: npm run test:integration:live
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_PROXY_TOKEN: ${{ secrets.MODAL_PROXY_TOKEN }}
      - name: Stop live test app
        if: always()
        continue-on-error: true
        run: modal app stop $env:LOCALMODAL_TEST_APP_NAME
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - name: Upload Extension Host logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-live-logs-${{ github.run_id }}
          path: .vscode-test/user-data/logs
          if-no-files-found: ignore
          retention-days: 7

  measure:
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.extension-live.result != 'cancelled' }}
    needs: extension-live
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOCALMODAL_APP_NAME: localmodal-qwen-ci-${{ github.run_id }}
      LOCALMODAL_MAX_MODEL_LEN: ${{ inputs.max_model_len || '131072' }}
      LOCALMODAL_MAX_DEPLOY_TO_READY_SECONDS: "1500"
      LOCALMODAL_MAX_READY_TO_FIRST_TOKEN_SECONDS: "180"
      LOCALMODAL_METRICS_FILE: artifacts/modal-startup.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install modal==1.3.5
      - run: npm ci
      - name: Measure Modal startup
        run: node scripts/modal-startup.mjs
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_PROXY_TOKEN: ${{ secrets.MODAL_PROXY_TOKEN }}
      - name: Stop measured app
        if: always()
        continue-on-error: true
        run: modal app stop "$LOCALMODAL_APP_NAME"
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modal-startup-${{ inputs.max_model_len || '131072' }}-${{ github.run_id }}
          path: artifacts/modal-startup.json
          if-no-files-found: ignore